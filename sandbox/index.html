<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox</title>
  <style>
    :root {
      --ink: #1a2332;
      --paper: #f7f3eb;
      --accent: #2f6f5e;
      --sky: #c5d8e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, var(--sky), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 90%, rgba(47, 111, 94, 0.18), transparent 50%),
        var(--paper);
    }

    main {
      text-align: center;
      padding: 2rem;
      animation: rise 700ms ease-out both;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    p {
      margin: 0;
      font-size: 1.25rem;
      opacity: 0.85;
      animation: rise 700ms ease-out 120ms both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sandbox</h1>
    <p>Hello.</p>
  </main>
</body>
</html>
